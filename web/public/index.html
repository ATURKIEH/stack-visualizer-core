<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Assembly Stack Visualizer</title>

  <style>
    :root{
      --bg:#ffffff;
      --fg:#0f172a;
      --muted:#64748b;
      --border:#e2e8f0;

      --brand:#4338ca;        /* indigo */
      --brand2:#5b21b6;       /* purple */
      --brandText:#ffffff;

      --btn:#2563eb;
      --btnText:#ffffff;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color:var(--fg);
      background: radial-gradient(1200px 600px at 50% -10%, rgba(67,56,202,0.10), transparent 60%),
                  radial-gradient(900px 500px at 80% 110%, rgba(91,33,182,0.10), transparent 55%),
                  var(--bg);
      min-height:100vh;
      display:flex;
      flex-direction:column;
    }

    header{
      height:58px;
      display:flex;
      align-items:center;
      padding:0 18px;
      background: linear-gradient(90deg, var(--brand2), var(--brand));
      color:var(--brandText);
    }

   header .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 900;
    letter-spacing: 0.2px;
  }

    .logo-nav {
      width: 22px;
      height: 22px;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.18));
    }

    .logoBox{
      width: 86px;
      height: 86px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(37,99,235,0.10);
      border: 1px solid rgba(37,99,235,0.22);
      box-shadow: 0 10px 24px rgba(2,6,23,0.08);
    }

    .logo-hero {
      width: 99px;
      height: 99px;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 10px 18px rgba(2,6,23,0.12));
    }
    
    header .brand a{
      color:inherit;
      text-decoration:none;
      display:flex;
      align-items:center;
      gap:10px;
    }

    main{
      flex:1;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:28px 16px;
    }

    .hero{
      width:min(980px, 100%);
      display:flex;
      flex-direction:column;
      align-items:center;
      text-align:center;
      gap:18px;
      padding:32px 18px;
    }

    .logoBox{
      width:74px;
      height:74px;
      border-radius:18px;
      display:flex;
      align-items:center;
      justify-content:center;
      background: rgba(37,99,235,0.10);
      border: 1px solid rgba(37,99,235,0.20);
    }

    h1{
      margin:0;
      font-size:36px;
      line-height:1.1;
      letter-spacing:-0.7px;
    }

    p{
      margin:0;
      color:var(--muted);
      max-width:720px;
      font-size:14px;
      line-height:1.6;
    }

    .ctaRow{
      margin-top:10px;
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:center;
      flex-wrap:wrap;
    }

    .btn{
      padding:10px 16px;
      border-radius:10px;
      border:1px solid transparent;
      background: rgba(37,99,235,0.92);
      color:var(--btnText);
      font-weight:800;
      cursor:pointer;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      gap:8px;
    }

    .btn.secondary{
      background:#fff;
      color:var(--fg);
      border-color:var(--border);
      font-weight:700;
    }

    footer{
      padding:18px 16px 24px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:18px;
      color:var(--muted);
      font-size:13px;
    }

    footer a{
      color:inherit;
      text-decoration:none;
      display:inline-flex;
      gap:8px;
      align-items:center;
    }

    .icon{
      width:16px;
      height:16px;
      display:inline-block;
    }
    


  </style>
</head>

<body>
  <header>
    <div class="brand">
      <a href="./index.html">
        <img
          src="./assets/logo.png"
          alt="Logo"
          class="logo-nav"
        />
        <span>Stack Visualizer</span>
      </a>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="logoBox" aria-hidden="true">
        
          <img
          src="./assets/logo.png"
          alt="Assembly Stack Visualizer Logo"
          class="logo-hero"
          />
        
      </div>

      <h1>Assembly Stack Visualizer</h1>

      <p>
        An interactive educational tool designed to help students and developers understand assembly execution.
        Visualize stack operations, register changes, and instruction flow in real-time as you step through your code.
      </p>

      <div class="ctaRow">
        <a class="btn" href="./visualizer.html">Launch Visualizer</a>
      </div>
    </section>
  </main>

  <footer>
    <a href="https://github.com/ATURKIEH/" title="GitHub">

      </svg>
      GitHub
    </a>

    <a href="https://www.linkedin.com/in/aref-turkieh/" title="LinkedIn">
      <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M20.45 20.45h-3.55v-5.6c0-1.34-.03-3.06-1.87-3.06-1.87 0-2.16 1.46-2.16 2.97v5.69H9.32V9h3.41v1.56h.05c.48-.9 1.64-1.86 3.37-1.86 3.6 0 4.27 2.37 4.27 5.45v6.3zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45z"/>
      </svg>
      LinkedIn
    </a>
  </footer>
</body>
</html>
